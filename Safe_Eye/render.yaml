services:
  - type: web
    name: safe-eye-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn Safe_Eye.asgi:application -k uvicorn.workers.UvicornWorker -w 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safe-eye-redis
          property: connectionString
      - key: DEBUG
        value: False

  - type: pserv
    name: safe-eye-db
    plan: free
    databaseName: safe_eye_db
    user: safe_eye_user

  - type: redis
    name: safe-eye-redis
    plan: free