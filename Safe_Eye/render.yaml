services:
  # --------------------------------------------------------------------
  # 1. The Web Service (for handling HTTP and WebSocket connections)
  #    This service runs Daphne.
  # --------------------------------------------------------------------
  - type: web
    name: safe-eye-backend
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input --clear
      python manage.py migrate
      python manage.py shell -c "from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username='admin').exists() or User.objects.create_superuser('admin', 'admin@example.com', 'admin123')"
    startCommand: daphne -b 0.0.0.0 -p $PORT Safe_Eye.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safe-eye-redis
          property: connectionString
      - key: DEBUG
        value: False
      # Add this environment variable to fix the Ultralytics warning
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics

  # --------------------------------------------------------------------
  # 2. The Worker Service (for running background tasks)
  #    This new service runs Celery.
  # --------------------------------------------------------------------
  - type: worker
    name: celery-worker
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: celery -A Safe_Eye worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        fromService:
          type: web
          name: safe-eye-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: safe-eye-redis
          property: connectionString
      - key: DEBUG
        value: False
      # Also add the YOLO_CONFIG_DIR here for the worker
      - key: YOLO_CONFIG_DIR
        value: /tmp/Ultralytics

# --------------------------------------------------------------------
# 3. Backend Services (Database and Redis Cache)
# --------------------------------------------------------------------
databases:
  - name: safe-eye-db
    databaseName: safe_eye_db
    user: safe_eye_user
    plan: free

services:
  - type: redis
    name: safe-eye-redis
    plan: free