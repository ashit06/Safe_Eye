# Corrected render.yaml for deployment with external Redis

services:
  # --------------------------------------------------------------------
  # 1. The Web Service (for handling HTTP and WebSocket connections)
  # --------------------------------------------------------------------
  - type: web
    name: safe-eye-backend
    env: python
    plan: free # Note: Render's free plans may spin down due to inactivity.
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --no-input --clear
      python manage.py migrate
    startCommand: daphne -b 0.0.0.0 -p $PORT Safe_Eye.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true # Render will securely generate this for you.
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db # Links to the database defined below
      - key: DEBUG
        value: False

  # --------------------------------------------------------------------
  # 2. The Worker Service (for running Celery background tasks)
  # --------------------------------------------------------------------
  - type: worker
    name: celery-worker
    env: python
    plan: free
    buildCommand: |
      pip install -r requirements.txt
    startCommand: celery -A Safe_Eye worker -l info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        fromService:
          type: web
          name: safe-eye-backend
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString
      - key: DEBUG
        value: False

# --------------------------------------------------------------------
# 3. The PostgreSQL Database Service
# --------------------------------------------------------------------
databases:
  - name: safe-eye-db
    databaseName: safe_eye_db
    user: safe_eye_user
    plan: free