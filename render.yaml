services:
  # --------------------------------------------------
  # Service 1: The Django Web Server (Daphne)
  # --------------------------------------------------
  - type: web
    name: safe-eye-web
    env: python
    plan: free
    rootDir: Safe_Eye # This is correct for your project structure
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT Safe_Eye.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString # <-- FIX #1 IS HERE
      - key: DEBUG
        value: False

  # --------------------------------------------------
  # Service 2: The Celery Background Worker
  # --------------------------------------------------
  - type: worker
    name: safe-eye-worker
    env: python
    plan: free
    rootDir: Safe_Eye
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A Safe_Eye worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        fromService:
          type: web
          name: safe-eye-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
          property: connectionString # <-- FIX #2 IS HERE
      - key: DEBUG
        value: False

# --------------------------------------------------
# Backend Dependency: PostgreSQL Database
# --------------------------------------------------
databases:
  - name: safe-eye-db
    databaseName: safe_eye_db
    user: safe_eye_user
    plan: free