# Corrected and Optimized render.yaml for Safe Eye Backend

services:
  # --------------------------------------------------
  # Service 1: The Django Web Server (Daphne)
  # --------------------------------------------------
  - type: web
    name: safe-eye-web
    env: python
    plan: free # Note: Free plans spin down and may have slower startup times.
    rootDir: Safe_Eye # Tells Render to run commands from the backend folder
    buildCommand: |
      pip install -r requirements.txt
      python manage.py migrate
      python manage.py collectstatic --no-input
    startCommand: daphne -b 0.0.0.0 -p $PORT Safe_Eye.asgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4 # Pinning your Python version is good practice
      - key: SECRET_KEY
        generateValue: true # Let Render create a secure key
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db # Links to the database below
      - key: DEBUG
        value: False
      # The following will be added manually in the Render Dashboard:
      # - REDIS_URL
      # - EMAIL_HOST_USER
      # - EMAIL_HOST_PASSWORD
      # - etc.

  # --------------------------------------------------
  # Service 2: The Celery Background Worker
  # --------------------------------------------------
  - type: worker
    name: safe-eye-worker
    env: python
    plan: free
    rootDir: Safe_Eye # Also run commands from the backend folder
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A Safe_Eye worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.4
      - key: SECRET_KEY
        fromService:
          type: web
          name: safe-eye-web
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: safe-eye-db
      - key: DEBUG
        value: False
      # Also add your email and Redis vars to the worker manually

# --------------------------------------------------
# Backend Dependency: PostgreSQL Database
# --------------------------------------------------
databases:
  - name: safe-eye-db
    databaseName: safe_eye_db
    user: safe_eye_user
    plan: free